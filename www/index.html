<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d">
<title>Sectional Warping Pro</title>
<style>
:root{--g:#166534;--d:#14532d;--bg:#f1f5f9;--bd:#dbe3ea}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:#172033}header{background:linear-gradient(135deg,#14532d,#15803d);color:white;padding:20px 12px;text-align:center}header h1{margin:0 0 6px;font-size:24px}header p{margin:0;font-size:13px}.topbar{max-width:900px;margin:12px auto 0;padding:0 12px;display:flex;justify-content:flex-end}select,input,button{font:inherit}select,input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:white;color:#172033}.lang{width:auto;min-width:145px}main{max-width:900px;margin:12px auto;padding:0 12px 28px}#home,.panel{background:white;border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 4px 16px #0f172a0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.menu-btn{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:18px 12px;text-align:left;cursor:pointer;min-height:78px;color:#172033}.menu-btn strong{display:block;color:var(--d);font-size:16px;margin-bottom:5px}.menu-btn span{font-size:12px;color:#64748b}.menu-btn:hover{border-color:var(--g);background:#f0fdf4}.panel{display:none}.panel h2{margin:0 0 16px;color:var(--d);font-size:21px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}label{display:block;font-size:14px;font-weight:700;margin:0 0 6px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:12px 17px;background:var(--g);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e2e8f0;color:#1e293b}.result{display:none;margin-top:16px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;line-height:1.8}.result strong{color:var(--d)}.result .big{font-size:22px;font-weight:800;color:var(--g)}.note{font-size:12px;color:#64748b;margin-top:12px}footer{text-align:center;padding:15px;color:#64748b;font-size:12px}[dir=rtl] .menu-btn{text-align:right}@media(max-width:480px){header h1{font-size:21px}.panel,#home{padding:13px}.menu-btn{min-height:70px}}
</style></head>
<body>
<header><h1>Sectional Warping Pro</h1><p id="subtitle">টেক্সটাইল ওয়ার্পিং ক্যালকুলেটর</p></header>
<div class="topbar"><select id="language" class="lang" aria-label="Language"><option value="bn">বাংলা</option><option value="en">English</option><option value="ur">اردو</option><option value="hi">हिन्दी</option><option value="ar">العربية</option></select></div>
<main>
<section id="home"><div class="grid">
<button class="menu-btn" onclick="openCalc('kgMeter')"><strong data-i="kgMeter">KG → Meter</strong><span data-i="kgMeterDesc">ওজন থেকে দৈর্ঘ্য</span></button>
<button class="menu-btn" onclick="openCalc('meterKg')"><strong data-i="meterKg">Meter → KG</strong><span data-i="meterKgDesc">দৈর্ঘ্য থেকে ওজন</span></button>
<button class="menu-btn" onclick="openCalc('totalWeight')"><strong data-i="totalWeight">Total Yarn Weight</strong><span data-i="totalWeightDesc">মোট সুতার ওজন (KG)</span></button>
<button class="menu-btn" onclick="openCalc('reed')"><strong data-i="reed">Reed Calculation</strong><span data-i="reedDesc">Ends per inch ও ends per dent</span></button>
<button class="menu-btn" onclick="openCalc('section')"><strong data-i="section">Section Calculator</strong><span data-i="sectionDesc">সেকশন সংখ্যা ও শেষ সেকশন</span></button>
<button class="menu-btn" onclick="openCalc('sectionWidth')"><strong data-i="sectionWidth">Section Width Calculator</strong><span data-i="sectionWidthDesc">সেকশনের প্রস্থ ইঞ্চি ও mm</span></button>
</div></section>
<section class="panel" id="kgMeter"><h2 data-i="kgMeter">KG → Meter</h2><div class="fields"><div><label data-i="yarnCount">Yarn Count</label><input id="kmCount" type="number" min="0" step="any" placeholder="e.g. 30"></div><div><label data-i="countSystem">Count System</label><select id="kmSystem"><option value="Ne">Ne</option><option value="Nm">Nm</option><option value="Tex">Tex</option></select></div><div><label data-i="weightKg">Weight (KG)</label><input id="kmWeight" type="number" min="0" step="any" placeholder="e.g. 5"></div></div><div class="actions"><button onclick="calculate('kgMeter')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="kmResult"></div></section>
<section class="panel" id="meterKg"><h2 data-i="meterKg">Meter → KG</h2><div class="fields"><div><label data-i="yarnCount">Yarn Count</label><input id="mkCount" type="number" min="0" step="any" placeholder="e.g. 30"></div><div><label data-i="countSystem">Count System</label><select id="mkSystem"><option value="Ne">Ne</option><option value="Nm">Nm</option><option value="Tex">Tex</option></select></div><div><label data-i="lengthM">Length (Meter)</label><input id="mkLength" type="number" min="0" step="any" placeholder="e.g. 1000"></div></div><div class="actions"><button onclick="calculate('meterKg')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="mkResult"></div></section>
<section class="panel" id="totalWeight"><h2 data-i="totalWeight">Total Yarn Weight</h2><div class="fields"><div><label data-i="yarnCount">Yarn Count</label><input id="twCount" type="number" min="0" step="any" placeholder="e.g. 30"></div><div><label data-i="countSystem">Count System</label><select id="twSystem"><option value="Ne">Ne</option><option value="Nm">Nm</option><option value="Tex">Tex</option></select></div><div><label data-i="lengthPerEnd">Length per End (Meter)</label><input id="twLength" type="number" min="0" step="any" placeholder="e.g. 1000"></div><div><label data-i="totalEnds">Total Ends</label><input id="twEnds" type="number" min="0" step="1" placeholder="e.g. 2400"></div></div><div class="actions"><button onclick="calculate('totalWeight')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="twResult"></div></section>
<section class="panel" id="reed"><h2 data-i="reed">Reed Calculation</h2><div class="fields"><div><label data-i="totalEnds">Total Ends</label><input id="reedEnds" type="number" min="0" step="1" placeholder="e.g. 2400"></div><div><label data-i="beamWidth">Beam Width (inch)</label><input id="reedWidth" type="number" min="0" step="any" placeholder="e.g. 120"></div><div><label data-i="reedRate">Reed Rate (dents/inch)</label><input id="reedRate" type="number" min="0" step="any" placeholder="e.g. 60"></div></div><div class="actions"><button onclick="calculate('reed')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="reedResult"></div><p class="note" data-i="reedNote">Reed Rate-কে dents per inch ধরে হিসাব করা হয়।</p></section>
<section class="panel" id="section"><h2 data-i="section">Section Calculator</h2><div class="fields"><div><label data-i="totalEnds">Total Ends</label><input id="secEnds" type="number" min="1" step="1" placeholder="e.g. 2300"></div><div><label data-i="creelEnds">Creel Ends (per section)</label><input id="secCreel" type="number" min="1" step="1" placeholder="e.g. 310"></div></div><div class="actions"><button onclick="calculate('section')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="secResult"></div></section>
<section class="panel" id="sectionWidth"><h2 data-i="sectionWidth">Section Width Calculator</h2><div class="fields"><div><label data-i="beamWidth">Beam Width (inch)</label><input id="swBeam" type="number" min="0" step="any" placeholder="e.g. 120"></div><div><label data-i="totalEnds">Total Ends</label><input id="swEnds" type="number" min="1" step="1" placeholder="e.g. 2400"></div><div><label data-i="totalCreel">Total Creel Ends / Section Ends</label><input id="swCreel" type="number" min="1" step="1" placeholder="e.g. 300"></div></div><div class="actions"><button onclick="calculate('sectionWidth')" data-i="calculate">হিসাব করুন</button><button class="secondary" onclick="goHome()" data-i="homeBtn">হোম</button></div><div class="result" id="swResult"></div><p class="note" data-i="sectionWidthNote">সূত্র: Beam Width ÷ Total Ends × Total Creel. 1 inch = 25.4 mm.</p></section>
</main><footer>Sectional Warping Pro</footer>
<script>
const D={
bn:{subtitle:'টেক্সটাইল ওয়ার্পিং ক্যালকুলেটর',kgMeter:'KG → Meter',kgMeterDesc:'ওজন থেকে দৈর্ঘ্য',meterKg:'Meter → KG',meterKgDesc:'দৈর্ঘ্য থেকে ওজন',totalWeight:'Total Yarn Weight',totalWeightDesc:'মোট সুতার ওজন (KG)',reed:'Reed Calculation',reedDesc:'Ends per inch ও ends per dent',section:'Section Calculator',sectionDesc:'সেকশন সংখ্যা ও শেষ সেকশন',sectionWidth:'Section Width Calculator',sectionWidthDesc:'সেকশনের প্রস্থ ইঞ্চি ও mm',yarnCount:'Yarn Count',countSystem:'Count System',weightKg:'Weight (KG)',lengthM:'Length (Meter)',lengthPerEnd:'Length per End (Meter)',totalEnds:'Total Ends (মোট সুতা)',beamWidth:'Beam Width (ইঞ্চি)',reedRate:'Reed Rate (dents/inch)',creelEnds:'Creel Ends (প্রতি সেকশনে)',totalCreel:'Total Creel Ends / Section Ends',calculate:'হিসাব করুন',homeBtn:'হোম',meters:'মিটার',kg:'কেজি',endsPerInch:'Ends per Inch',dentsPerInch:'Dents per Inch',endsPerDent:'Ends per Dent',totalSections:'মোট সেকশন',fullSections:'পূর্ণ সেকশন',lastSection:'শেষ সেকশনের Ends',eachFull:'প্রতি পূর্ণ সেকশনের Ends',widthIn:'Section Width (ইঞ্চি)',widthMm:'Section Width (মিলিমিটার)',error:'সঠিক সংখ্যা দিন।',reedNote:'Reed Rate-কে dents per inch ধরে হিসাব করা হয়।',sectionWidthNote:'সূত্র: Beam Width ÷ Total Ends × Total Creel. 1 inch = 25.4 mm.'},
en:{subtitle:'Textile warping calculator',kgMeter:'KG → Meter',kgMeterDesc:'Weight to length',meterKg:'Meter → KG',meterKgDesc:'Length to weight',totalWeight:'Total Yarn Weight',totalWeightDesc:'Total yarn weight (KG)',reed:'Reed Calculation',reedDesc:'Ends per inch and ends per dent',section:'Section Calculator',sectionDesc:'Section count and last section',sectionWidth:'Section Width Calculator',sectionWidthDesc:'Section width in inches and mm',yarnCount:'Yarn Count',countSystem:'Count System',weightKg:'Weight (KG)',lengthM:'Length (Meter)',lengthPerEnd:'Length per End (Meter)',totalEnds:'Total Ends',beamWidth:'Beam Width (inch)',reedRate:'Reed Rate (dents/inch)',creelEnds:'Creel Ends (per section)',totalCreel:'Total Creel Ends / Section Ends',calculate:'Calculate',homeBtn:'Home',meters:'meters',kg:'kg',endsPerInch:'Ends per Inch',dentsPerInch:'Dents per Inch',endsPerDent:'Ends per Dent',totalSections:'Total Sections',fullSections:'Full Sections',lastSection:'Ends in Last Section',eachFull:'Ends per Full Section',widthIn:'Section Width (inch)',widthMm:'Section Width (millimeter)',error:'Please enter valid numbers.',reedNote:'Reed Rate is treated as dents per inch.',sectionWidthNote:'Formula: Beam Width ÷ Total Ends × Total Creel. 1 inch = 25.4 mm.'},
ur:{subtitle:'ٹیکسٹائل وارپنگ کیلکولیٹر',kgMeter:'KG → Meter',kgMeterDesc:'وزن سے لمبائی',meterKg:'Meter → KG',meterKgDesc:'لمبائی سے وزن',totalWeight:'کل دھاگے کا وزن',totalWeightDesc:'کل وزن (KG)',reed:'ریڈ کیلکولیشن',reedDesc:'فی انچ اینڈز اور فی ڈینٹ',section:'سیکشن کیلکولیٹر',sectionDesc:'سیکشن کی تعداد اور آخری سیکشن',sectionWidth:'سیکشن کی چوڑائی',sectionWidthDesc:'انچ اور ملی میٹر میں چوڑائی',yarnCount:'یارن کاؤنٹ',countSystem:'کاؤنٹ سسٹم',weightKg:'وزن (KG)',lengthM:'لمبائی (میٹر)',lengthPerEnd:'فی اینڈ لمبائی (میٹر)',totalEnds:'کل اینڈز',beamWidth:'بیم کی چوڑائی (انچ)',reedRate:'ریڈ ریٹ (ڈینٹ/انچ)',creelEnds:'فی سیکشن کریل اینڈز',totalCreel:'کل کریل اینڈز / سیکشن اینڈز',calculate:'حساب کریں',homeBtn:'ہوم',meters:'میٹر',kg:'کلوگرام',endsPerInch:'اینڈز فی انچ',dentsPerInch:'ڈینٹس فی انچ',endsPerDent:'اینڈز فی ڈینٹ',totalSections:'کل سیکشن',fullSections:'مکمل سیکشن',lastSection:'آخری سیکشن کے اینڈز',eachFull:'ہر مکمل سیکشن کے اینڈز',widthIn:'سیکشن چوڑائی (انچ)',widthMm:'سیکشن چوڑائی (ملی میٹر)',error:'درست اعداد درج کریں۔',reedNote:'ریڈ ریٹ کو ڈینٹس فی انچ سمجھا گیا ہے۔',sectionWidthNote:'فارمولا: بیم چوڑائی ÷ کل اینڈز × کل کریل۔ 1 انچ = 25.4 ملی میٹر۔'},
hi:{subtitle:'टेक्सटाइल वार्पिंग कैलकुलेटर',kgMeter:'KG → Meter',kgMeterDesc:'वजन से लंबाई',meterKg:'Meter → KG',meterKgDesc:'लंबाई से वजन',totalWeight:'कुल धागे का वजन',totalWeightDesc:'कुल वजन (KG)',reed:'रीड कैलकुलेशन',reedDesc:'प्रति इंच एंड्स और प्रति डेंट',section:'सेक्शन कैलकुलेटर',sectionDesc:'सेक्शन संख्या और अंतिम सेक्शन',sectionWidth:'सेक्शन चौड़ाई कैलकुलेटर',sectionWidthDesc:'इंच और mm में चौड़ाई',yarnCount:'यार्न काउंट',countSystem:'काउंट सिस्टम',weightKg:'वजन (KG)',lengthM:'लंबाई (मीटर)',lengthPerEnd:'प्रति एंड लंबाई (मीटर)',totalEnds:'कुल एंड्स',beamWidth:'बीम चौड़ाई (इंच)',reedRate:'रीड रेट (डेंट/इंच)',creelEnds:'प्रति सेक्शन क्रील एंड्स',totalCreel:'कुल क्रील एंड्स / सेक्शन एंड्स',calculate:'गणना करें',homeBtn:'होम',meters:'मीटर',kg:'किलोग्राम',endsPerInch:'प्रति इंच एंड्स',dentsPerInch:'प्रति इंच डेंट',endsPerDent:'प्रति डेंट एंड्स',totalSections:'कुल सेक्शन',fullSections:'पूरे सेक्शन',lastSection:'अंतिम सेक्शन के एंड्स',eachFull:'हर पूरे सेक्शन के एंड्स',widthIn:'सेक्शन चौड़ाई (इंच)',widthMm:'सेक्शन चौड़ाई (मिलीमीटर)',error:'कृपया सही संख्या दर्ज करें।',reedNote:'रीड रेट को डेंट प्रति इंच माना गया है।',sectionWidthNote:'सूत्र: बीम चौड़ाई ÷ कुल एंड्स × कुल क्रील। 1 इंच = 25.4 mm.'},
ar:{subtitle:'حاسبة تقسية خيوط النسيج',kgMeter:'KG → Meter',kgMeterDesc:'الوزن إلى الطول',meterKg:'Meter → KG',meterKgDesc:'الطول إلى الوزن',totalWeight:'إجمالي وزن الخيوط',totalWeightDesc:'إجمالي الوزن (KG)',reed:'حساب الرييد',reedDesc:'النهايات لكل بوصة ولكل سن',section:'حاسبة الأقسام',sectionDesc:'عدد الأقسام والقسم الأخير',sectionWidth:'حاسبة عرض القسم',sectionWidthDesc:'العرض بالبوصة والمليمتر',yarnCount:'نمرة الخيط',countSystem:'نظام العد',weightKg:'الوزن (KG)',lengthM:'الطول (متر)',lengthPerEnd:'الطول لكل نهاية (متر)',totalEnds:'إجمالي النهايات',beamWidth:'عرض البكرة (بوصة)',reedRate:'معدل الرييد (أسنان/بوصة)',creelEnds:'نهايات الكريل لكل قسم',totalCreel:'إجمالي نهايات الكريل / نهايات القسم',calculate:'احسب',homeBtn:'الرئيسية',meters:'متر',kg:'كجم',endsPerInch:'النهايات لكل بوصة',dentsPerInch:'الأسنان لكل بوصة',endsPerDent:'النهايات لكل سن',totalSections:'إجمالي الأقسام',fullSections:'الأقسام الكاملة',lastSection:'نهايات القسم الأخير',eachFull:'نهايات كل قسم كامل',widthIn:'عرض القسم (بوصة)',widthMm:'عرض القسم (مليمتر)',error:'يرجى إدخال أرقام صحيحة.',reedNote:'يُفترض أن معدل الرييد هو عدد الأسنان لكل بوصة.',sectionWidthNote:'المعادلة: عرض البكرة ÷ إجمالي النهايات × إجمالي الكريل. البوصة = 25.4 مم.'}
};
let lang='bn';function tr(k){return (D[lang]&&D[lang][k])||D.en[k]||k}function applyLanguage(){lang=document.getElementById('language').value;document.documentElement.lang=lang;document.documentElement.dir=['ur','ar'].includes(lang)?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));document.getElementById('subtitle').textContent=tr('subtitle')}
document.getElementById('language').addEventListener('change',applyLanguage);function openCalc(id){document.getElementById('home').style.display='none';document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';window.scrollTo({top:0,behavior:'smooth'})}function goHome(){document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.getElementById('home').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function metersPerKg(c,s){if(s==='Ne')return c*1693.4;if(s==='Nm')return c*1000;return 1000000/c}function num(id){return Number(document.getElementById(id).value)}function valid(a){return a.every(v=>Number.isFinite(v)&&v>0)}function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:3})}function show(id,h){let e=document.getElementById(id);e.innerHTML=h;e.style.display='block'}
function calculate(type){
if(type==='kgMeter'){let c=num('kmCount'),w=num('kmWeight'),s=document.getElementById('kmSystem').value;if(!valid([c,w]))return alert(tr('error'));show('kmResult',`<strong>${tr('meters')}:</strong> <span class="big">${fmt(w*metersPerKg(c,s))} ${tr('meters')}</span>`);return}
if(type==='meterKg'){let c=num('mkCount'),m=num('mkLength'),s=document.getElementById('mkSystem').value;if(!valid([c,m]))return alert(tr('error'));show('mkResult',`<strong>${tr('kg')}:</strong> <span class="big">${fmt(m/metersPerKg(c,s))} ${tr('kg')}</span>`);return}
if(type==='totalWeight'){let c=num('twCount'),l=num('twLength'),e=num('twEnds'),s=document.getElementById('twSystem').value;if(!valid([c,l,e]))return alert(tr('error'));show('twResult',`<strong>${tr('totalWeight')}:</strong> <span class="big">${fmt(l*e/metersPerKg(c,s))} ${tr('kg')}</span>`);return}
if(type==='reed'){let e=num('reedEnds'),w=num('reedWidth'),r=num('reedRate');if(!valid([e,w,r]))return alert(tr('error'));show('reedResult',`<div><strong>${tr('endsPerInch')}:</strong> ${fmt(e/w)}</div><div><strong>${tr('dentsPerInch')}:</strong> ${fmt(r)}</div><div><strong>${tr('endsPerDent')}:</strong> ${fmt((e/w)/r)}</div>`);return}
if(type==='section'){let e=num('secEnds'),c=num('secCreel');if(!valid([e,c])||!Number.isInteger(e)||!Number.isInteger(c))return alert(tr('error'));let total=Math.ceil(e/c),full=Math.floor(e/c),rem=e%c,last=rem===0?c:rem;show('secResult',`<div><strong>${tr('totalSections')}:</strong> ${fmt(total)}</div><div><strong>${tr('fullSections')}:</strong> ${fmt(full)}</div><div><strong>${tr('eachFull')}:</strong> ${fmt(c)}</div><div><strong>${tr('lastSection')}:</strong> ${fmt(last)}</div>`);return}
if(type==='sectionWidth'){let b=num('swBeam'),e=num('swEnds'),c=num('swCreel');if(!valid([b,e,c])||!Number.isInteger(e)||!Number.isInteger(c)||c>e)return alert(tr('error'));let inch=(b/e)*c,mm=inch*25.4;show('swResult',`<div><strong>${tr('widthIn')}:</strong> <span class="big">${fmt(inch)} in</span></div><div><strong>${tr('widthMm')}:</strong> <span class="big">${fmt(mm)} mm</span></div>`);return}
}applyLanguage();
</script></body></html>
