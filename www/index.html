<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<meta name="description" content="Sectional Warping Pro textile calculation app">
<title>Sectional Warping Pro</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f0fdf4;color:#14532d}
header{background:#14532d;color:white;padding:22px 15px;text-align:center;border-radius:0 0 20px 20px}
header h1{font-size:24px;margin:0 0 16px}
header select{width:100%;max-width:300px;padding:12px;border-radius:9px;border:0}
main{max-width:480px;margin:20px auto;padding:0 14px}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 4px 12px #0001}
.menu button{background:white;color:#14532d;border:1px solid #bbf7d0;text-align:start;font-weight:bold;padding:16px;cursor:pointer;line-height:1.6}
.menu button:hover{background:#dcfce7}
button,input,select{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #ccc;font-size:15px}
.action{background:#15803d;color:white;border:0;font-weight:bold;cursor:pointer}
.home{background:#e5e7eb;color:#14532d;border:0;font-weight:bold;cursor:pointer}
.hidden{display:none!important}
#result{background:#dcfce7;padding:15px;border-radius:10px;margin-top:12px;overflow-wrap:anywhere;line-height:1.9}
.result-row{padding:7px 0;border-bottom:1px solid #bbf7d0}
.result-row:last-child{border-bottom:0}
.small{font-size:13px;color:#64748b;line-height:1.7}
footer{text-align:center;padding:20px;font-size:12px;color:#64748b}
body[dir="rtl"]{text-align:right}
body[dir="rtl"] input,body[dir="rtl"] select{text-align:right}
body[dir="rtl"] .menu button{text-align:right}
</style>
</head>

<body>
<header>
<h1>Sectional Warping Pro</h1>
<select id="lang" onchange="changeLanguage()">
<option value="bn">🇧🇩 বাংলা</option>
<option value="en">🇬🇧 English</option>
<option value="ur">🇵🇰 اردو</option>
<option value="hi">🇮🇳 हिन्दी</option>
<option value="ar">🇸🇦 العربية</option>
</select>
</header>

<main>
<section id="home" class="card menu">
<h2 id="menuTitle"></h2>
<button onclick="openPage('kg')" id="menuKg"></button>
<button onclick="openPage('meter')" id="menuMeter"></button>
<button onclick="openPage('total')" id="menuTotal"></button>
<button onclick="openPage('reed')" id="menuReed"></button>
<button onclick="openPage('section')" id="menuSection"></button>
<button onclick="openPage('sectionWidth')" id="menuSectionWidth"></button>
</section>

<section id="calculator" class="card hidden">
<h2 id="pageTitle"></h2>

<div id="countGroup">
<label id="countLabel"></label>
<input id="count" type="number" min="0" step="any" placeholder="30">

<label id="systemLabel"></label>
<select id="system">
<option value="Ne">Ne — English Count</option>
<option value="Nm">Nm — Metric Count</option>
<option value="Tex">Tex</option>
</select>
</div>

<div id="quantityGroup">
<label id="quantityLabel"></label>
<input id="quantity" type="number" min="0" step="any">
</div>

<div id="extraFields"></div>
<button type="button" class="action" id="calcButton" onclick="calculate()"></button>
<div id="result" class="hidden" aria-live="polite"></div>
<button type="button" class="home" id="homeButton" onclick="goHome()"></button>
</section>

<p class="small" id="notice"></p>
</main>

<footer>Sectional Warping Pro</footer>

let currentPage="";

function t(key){
 return translations[document.getElementById("lang").value][key];
}

function formatNumber(value,digits=3){
 return value.toLocaleString("en-US",{maximumFractionDigits:digits});
}

function changeLanguage(){
 const lang=document.getElementById("lang").value;
 const rtl=lang==="ur"||lang==="ar";
 document.documentElement.lang=lang;
 document.documentElement.dir=rtl?"rtl":"ltr";
 document.body.dir=rtl?"rtl":"ltr";

 document.getElementById("menuTitle").textContent=t("menu");
 document.getElementById("menuKg").textContent=t("kg");
 document.getElementById("menuMeter").textContent=t("meter");
 document.getElementById("menuTotal").textContent=t("total");
 document.getElementById("menuReed").textContent=t("reed");
 document.getElementById("menuSection").textContent=t("section");
 document.getElementById("menuSectionWidth").textContent=t("sectionWidth");
 document.getElementById("countLabel").textContent=t("count");
 document.getElementById("systemLabel").textContent=t("system");
 document.getElementById("calcButton").textContent=t("calculate");
 document.getElementById("homeButton").textContent=t("home");
 document.getElementById("notice").textContent=t("notice");
 if(currentPage)openPage(currentPage);
}

function openPage(page){
 currentPage=page;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("calculator").classList.remove("hidden");
 document.getElementById("pageTitle").textContent=
  translations[document.getElementById("lang").value].titles[page];

 const box=document.getElementById("result");
 box.classList.add("hidden");
 box.innerHTML="";

 const countGroup=document.getElementById("countGroup");
 const quantityGroup=document.getElementById("quantityGroup");
 const extra=document.getElementById("extraFields");

 countGroup.classList.remove("hidden");
 quantityGroup.classList.remove("hidden");
 extra.innerHTML="";
 document.getElementById("count").value="";
 document.getElementById("quantity").value="";

 if(page==="kg"){
  document.getElementById("quantityLabel").textContent=t("weight");
  document.getElementById("quantity").placeholder="25";
 }
 else if(page==="meter"){
  document.getElementById("quantityLabel").textContent=t("length");
  document.getElementById("quantity").placeholder="5000";
 }
 else if(page==="total"){
  document.getElementById("quantityLabel").textContent=t("length");
  document.getElementById("quantity").placeholder="1000";
  extra.innerHTML=`
   <label for="totalEnds">${t("ends")}</label>
   <input id="totalEnds" type="number" min="1" step="1" placeholder="1200">
  `;
 }
 else if(page==="reed"){
  countGroup.classList.add("hidden");
  quantityGroup.classList.add("hidden");
  extra.innerHTML=`
   <label for="totalEnds">${t("ends")}</label>
   <input id="totalEnds" type="number" min="1" step="1" placeholder="4800">
   <label for="beamWidth">${t("beamWidth")}</label>
   <input id="beamWidth" type="number" min="0.01" step="any" placeholder="60">
   <label for="reedRate">${t("reedRate")}</label>
   <input id="reedRate" type="number" min="0.01" step="any" placeholder="80">
  `;
 }
 else if(page==="section"){
  countGroup.classList.add("hidden");
  quantityGroup.classList.add("hidden");
  extra.innerHTML=`
   <label for="totalEnds">${t("ends")}</label>
   <input id="totalEnds" type="number" min="1" step="1" placeholder="2300">
   <label for="creelEnds">${t("creelEnds")}</label>
   <input id="creelEnds" type="number" min="1" step="1" placeholder="310">
  `;
 }
 else if(page==="sectionWidth"){
  countGroup.classList.add("hidden");
  quantityGroup.classList.add("hidden");
  extra.innerHTML=`
   <label for="beamWidth">${t("beamWidth")}</label>
   <input id="beamWidth" type="number" min="0.01" step="any" placeholder="120">
   <label for="totalEnds">${t("ends")}</label>
   <input id="totalEnds" type="number" min="1" step="1" placeholder="2400">
   <label for="totalCreel">${t("totalCreel")}</label>
   <input id="totalCreel" type="number" min="1" step="1" placeholder="300">
  `;
 }
}

function goHome(){
 currentPage="";
 document.getElementById("calculator").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
 const box=document.getElementById("result");
 box.classList.add("hidden");
 box.innerHTML="";
}

function metersPerKg(count,system){
 if(system==="Ne")return count*1693.4;
 if(system==="Nm")return count*1000;
 return 1000000/count;
}

function calculate(){
 const box=document.getElementById("result");
 let output="";

 if(["kg","meter","total"].includes(currentPage)){
  const count=Number(document.getElementById("count").value);
  const qty=Number(document.getElementById("quantity").value);
  const system=document.getElementById("system").value;

  if(!Number.isFinite(count)||!Number.isFinite(qty)||count<=0||qty<=0){
   alert(t("invalid"));return;
  }

  const factor=metersPerKg(count,system);
  if(!Number.isFinite(factor)||factor<=0){alert(t("invalid"));return;}

  if(currentPage==="kg"){
   output=t("totalLength")+": "+formatNumber(qty*factor)+" m";
  }else if(currentPage==="meter"){
   output=t("estimatedWeight")+": "+formatNumber(qty/factor)+" kg";
  }else{
   const ends=Number(document.getElementById("totalEnds").value);
   if(!Number.isInteger(ends)||ends<=0){alert(t("invalid"));return;}
   const totalKg=(qty*ends)/factor;
   output=t("estimatedWeight")+": "+formatNumber(totalKg)+" kg";
  }
 }
 else if(currentPage==="reed"){
  const ends=Number(document.getElementById("totalEnds").value);
  const beamWidth=Number(document.getElementById("beamWidth").value);
  const reedRate=Number(document.getElementById("reedRate").value);

  if(!Number.isInteger(ends)||ends<=0||!Number.isFinite(beamWidth)||beamWidth<=0||
     !Number.isFinite(reedRate)||reedRate<=0){alert(t("invalid"));return;}

  const endsPerInch=ends/beamWidth;
  const endsPerDent=endsPerInch/reedRate;
  output=
   `<div class="result-row"><strong>${t("endsPerInch")}:</strong> ${formatNumber(endsPerInch,4)}</div>`+
   `<div class="result-row"><strong>${t("dentsPerInch")}:</strong> ${formatNumber(reedRate,4)}</div>`+
   `<div class="result-row"><strong>${t("endsPerDent")}:</strong> ${formatNumber(endsPerDent,4)}</div>`;
 }
 else if(currentPage==="section"){
  const ends=Number(document.getElementById("totalEnds").value);
  const creel=Number(document.getElementById("creelEnds").value);

  if(!Number.isInteger(ends)||ends<=0||!Number.isInteger(creel)||creel<=0||creel>ends){
   alert(t("invalid"));return;
  }

  const fullSections=Math.floor(ends/creel);
  const remainingEnds=ends%creel;
  const totalSections=Math.ceil(ends/creel);
  const lastSectionEnds=remainingEnds===0?creel:remainingEnds;

  output=
   `<div class="result-row"><strong>${t("ends")}:</strong> ${formatNumber(ends,0)}</div>`+
   `<div class="result-row"><strong>${t("creelEnds")}:</strong> ${formatNumber(creel,0)}</div>`+
   `<div class="result-row"><strong>${t("totalSections")}:</strong> ${formatNumber(totalSections,0)}</div>`+
   `<div class="result-row"><strong>${t("fullSections")}:</strong> ${formatNumber(fullSections,0)}</div>`+
   `<div class="result-row"><strong>${t("eachFull")}:</strong> ${formatNumber(creel,0)}</div>`+
   `<div class="result-row"><strong>${t("lastSection")}:</strong> ${formatNumber(lastSectionEnds,0)}</div>`;
 }
 else if(currentPage==="sectionWidth"){
  const beamWidth=Number(document.getElementById("beamWidth").value);
  const ends=Number(document.getElementById("totalEnds").value);
  const totalCreel=Number(document.getElementById("totalCreel").value);

  if(!Number.isFinite(beamWidth)||beamWidth<=0||!Number.isInteger(ends)||ends<=0||
     !Number.isInteger(totalCreel)||totalCreel<=0||totalCreel>ends){
   alert(t("invalid"));return;
  }

  const widthInches=(beamWidth/ends)*totalCreel;
  const widthMm=widthInches*25.4;

  output=
   `<div class="result-row"><strong>${t("sectionWidthInches")}:</strong> ${formatNumber(widthInches,4)} in</div>`+
   `<div class="result-row"><strong>${t("sectionWidthMm")}:</strong> ${formatNumber(widthMm,3)} mm</div>`;
 }

 box.innerHTML="<strong>"+t("result")+"</strong><br>"+output;
 box.classList.remove("hidden");
 if (window.maybeShowInterstitialAd) window.maybeShowInterstitialAd();
}

changeLanguage();
</script>
